name: Release

# Publishes packages/next-blog to npm when a tag like v0.2.0 is pushed. Uses npm trusted
# publishing, so no npm token is stored in this repository. Trusted publishing is set up on an
# existing package, so the first version is published by hand. The job runs in the `npm`
# environment, which needs a reviewer's approval and is the environment named in npm's trusted
# publisher settings.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.1
      - run: bun install --frozen-lockfile
      # npm shows the README and LICENSE from the package folder.
      - run: cp README.md LICENSE packages/next-blog/
      - run: npm publish
        working-directory: packages/next-blog
